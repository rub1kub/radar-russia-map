<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Заголовок собран под то, как люди действительно ищут: «карта БПЛА»,
         «тревога сейчас», а не под наше внутреннее имя. Бренд в конце —
         сначала ответ на запрос, потом кто отвечает. -->
    <title>Карта БПЛА и тревог по России — обстановка сейчас · Тихое небо</title>
    <meta
      name="description"
      content="Карта воздушной обстановки по России в реальном времени: тревоги, сообщения о беспилотниках и отбои по регионам и районам. По открытым Telegram-каналам, с указанием источников."
    />
    <link rel="canonical" href="https://tihoenebo.com/" />

    <!-- Превью при пересылке. Сайт будут кидать ссылкой в Telegram и ВК —
         без этого блока там был бы пустой прямоугольник. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Тихое небо" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://tihoenebo.com/" />
    <meta property="og:title" content="Карта БПЛА и тревог по России — обстановка сейчас" />
    <meta
      property="og:description"
      content="Тревоги, сообщения о беспилотниках и отбои по регионам и районам. Обновляется в реальном времени по открытым источникам."
    />
    <meta property="og:image" content="https://tihoenebo.com/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0e1211" />
    <!-- Иконки файлами, а не data:URI. Яндекс — и Вебмастер, и выдача —
         забирает именно /favicon.ico: пока его не было, сайт в поиске
         оставался без значка. Тем же путём иконку берут закладки iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Разметка для поисковиков: без неё карта для робота — пустой div. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Тихое небо",
        "alternateName": "Карта обстановки",
        "url": "https://tihoenebo.com/",
        "description": "Карта воздушной обстановки по России: тревоги, сообщения о беспилотниках и отбои по регионам и районам.",
        "inLanguage": "ru-RU"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Яндекс Метрика. Вебвизор, карта кликов и запись движений мыши
         выключены намеренно: сюда заходят посмотреть, что происходит над
         своим домом, и записывать поведение такого посетителя незачем.
         Считаем только посещаемость и источники переходов. Скрипт грузится
         после карты, чтобы не отнимать у неё первые секунды. -->
    <script type="text/javascript">
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        for (var j = 0; j < document.scripts.length; j++) {
          if (document.scripts[j].src === r) return;
        }
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

      window.addEventListener("load", function () {
        // ssr здесь был ошибкой: с этим флагом Метрика не отправляет
        // просмотр сама — ждёт ручного ym(id, "hit", url) от серверного
        // рендеринга, которого у нас нет. Тег грузился, ym определялся,
        // а посетителей в отчётах не было ни одного, включая владельца.
        ym(111170964, "init", {
          webvisor: false,
          clickmap: false,
          trackLinks: true,
          accurateTrackBounce: true
        });
      });
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/111170964"
      style="position:absolute; left:-9999px;" alt="" /></div></noscript>

    <!-- Робот видит SPA пустой, поэтому суть страницы дана текстом. Для
         человека блок скрыт: скрипт удаляет его сразу после загрузки
         карты, а до неё он служит понятной заглушкой вместо белого
         экрана. -->
    <noscript>
      <h1>Карта воздушной обстановки по России</h1>
      <p>
        Тревоги, сообщения о беспилотниках и отбои по регионам и районам —
        по открытым Telegram-каналам. Для просмотра карты включите
        JavaScript.
      </p>
    </noscript>

    <!-- Мини-приложение Telegram: скрипт даёт window.Telegram.WebApp, без
         него карта в мессенджере открывается наполовину экрана и под
         панелью бота. В обычном браузере он безвреден.

         Отдаём со своего домена, а не с telegram.org: в России домен
         недоступен, и у половины аудитории мини-приложение осталось бы
         неинициализированным — то есть открывалось бы как обычная
         страница, без полного экрана и с чужими цветами панелей.
         Копию обновлять вручную: scripts/update-telegram-sdk.sh -->
    <script src="/vendor/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

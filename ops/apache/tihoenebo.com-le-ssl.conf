<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tihoenebo.com
    Protocols h2 http/1.1
    ServerAlias www.tihoenebo.com

    # Не удерживать поток при незавершённом TLS-рукопожатии.
    RequestReadTimeout handshake=15

    DocumentRoot /opt/tihoenebo/dist
    <Directory /opt/tihoenebo/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.tihoenebo\.com$ [NC]
    RewriteRule ^ https://tihoenebo.com%{REQUEST_URI} [R=301,L,NE]

    # Старые вкладки умеют HTTP-опрос. Отказ до Upgrade не создаёт туннель.
    RewriteRule ^/api/v1/stream$ - [G,L]

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8010/api/
    ProxyPassReverse /api/ http://127.0.0.1:8010/api/

    <LocationMatch "^/(assets|data)/">
        Header always set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header always set Cache-Control "no-cache"
    </LocationMatch>

    SSLCertificateFile /etc/letsencrypt/live/tihoenebo.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tihoenebo.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    AddOutputFilterByType DEFLATE application/json

    ErrorLog ${APACHE_LOG_DIR}/tihoenebo_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/tihoenebo_ssl_access.log combined
</VirtualHost>
</IfModule>
